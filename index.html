<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen-wrapper">
        
        <img src="images/minecraft-image.png">
        
            <div class="audio-player">
                <div class="text-info">
                    <h2 class="now-playing"></h2>
                    <h5 class="duration"></h5>
                </div>
                
                <input type="range" id="slider">
                <button id="prev-button" class="buttons">◀◀</button>
                <button id="play-button" class="buttons">▶</button>
                <button id="next-button" class="buttons">▶▶</button>
                <audio></audio>
            </div>
       
    </div>


    <script src="script.js"></script>
    
</body>
</html>
